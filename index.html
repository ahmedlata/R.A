<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد التحكم والموقع عن بُعد الحقيقي</title>
    <!-- استدعاء مكتبة PeerJS للربط الحقيقي بين الأجهزة -->
    <script src="https://unpkg.com"></script>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22RemoteAssist%22,%22short_name%22:%22Assist%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23da251c%22}">
    <style>
        :root { --primary: #da251c; --bg: #f8f9fa; --card: #ffffff; --text: #212529; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn-install { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; display: none; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .id-box { background: #e9ecef; padding: 15px; font-size: 24px; text-align: center; font-weight: bold; letter-spacing: 2px; border-radius: 5px; color: var(--primary); margin: 10px 0; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #ced4da; box-sizing: border-box; font-size: 16px; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .status { padding: 10px; border-radius: 5px; background: #fff3cd; color: #856404; margin-top: 10px; font-size: 14px; text-align: center; }
        .control-panel { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🧑‍💻 تطبيق التحكم والموقع الحقيقي عن بُعد</h2>
        <button id="installBtn" class="btn-install">📥 تحميل التطبيق</button>
    </div>

    <div class="card">
        <h3>رمز هذا الجهاز الحالي:</h3>
        <div class="id-box" id="myId">جاري التوليد...</div>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3>الاتصال بجهاز آخر للتحكم به:</h3>
        <input type="text" id="targetId" placeholder="أدخل رمز الجهاز الآخر">
        <button onclick="connectToDevice()">🔗 اتصال بالرمز</button>
        <div class="status" id="connectionStatus">غير متصل بأي جهاز</div>
    </div>

    <!-- لوحة التحكم الحقيقية للمتحكِم -->
    <div class="card control-panel" id="controlPanel">
        <h3>🎮 لوحة التحكم بالجهاز المقترن</h3>
        <button onclick="triggerRemoteAction('get_location')" style="background-color: #007bff;">📍 طلب تتبع الموقع الجغرافي الفعلي</button>
        <div id="locationResult" style="margin-top:10px; font-weight:bold; color: #007bff;"></div>
        
        <button onclick="triggerRemoteAction('open_site')" style="background-color: #6c757d; margin-top: 15px;">🌐 أمر: فتح موقع جوجل عند الطرف الآخر</button>
        <button onclick="triggerRemoteAction('alert')" style="background-color: #ffc107; color: black; margin-top: 10px;">🔔 أمر: إرسال تنبيه نصي شاشة الطرف الآخر</button>
    </div>
</div>

<script>
    let peer;
    let conn;

    // توليد رمز حقيقي فريد من سيرفر PeerJS
    peer = new Peer();
    
    peer.on('open', (id) => {
        // نأخذ أول 6 أرقام فقط للسهولة
        const shortId = id.substr(0, 6);
        document.getElementById('myId').innerText = shortId;
    });

    // استقبال الاتصال والأوامر من الجهاز الآخر (للجهاز المُستقبِل)
    peer.on('connection', (connection) => {
        conn = connection;
        document.getElementById('connectionStatus').innerText = "تم الاتصال بك! هذا الجهاز تحت التحكم المشترك الآن.";
        document.getElementById('connectionStatus').style.background = "#d4edda";
        document.getElementById('connectionStatus').style.color = "#155724";

        conn.on('data', (data) => {
            handleRemoteCommand(data);
        });
    });

    // بدء الاتصال بجهاز آخر (للجهاز المتحكِّم)
    function connectToDevice() {
        const target = document.getElementById('targetId').value.trim();
        if(!target) return alert("أدخل الرمز أولاً");

        document.getElementById('connectionStatus').innerText = "جاري الاتصال...";
        
        // الاتصال الحقيقي
        conn = peer.connect(target);
        
        conn.on('open', () => {
            document.getElementById('connectionStatus').innerText = `متصل بنجاح بالجهاز: ${target}`;
            document.getElementById('connectionStatus').style.background = "#d4edda";
            document.getElementById('connectionStatus').style.color = "#155724";
            document.getElementById('controlPanel').style.display = "block"; // إظهار لوحة التحكم
        });

        conn.on('data', (data) => {
            if(data.type === 'location_response') {
                document.getElementById('locationResult').innerHTML = `
                    ✅ موقع الجهاز الآخر الفعلي:<br>
                    <a href="https://google.com{data.lat},${data.lon}" target="_blank">🗺️ اضغط هنا لفتح الموقع الحالي على خريطة جوجل</a>
                `;
            }
        });
    }

    // إرسال الأوامر للجهاز الآخر
    function triggerRemoteAction(action) {
        if (!conn) return alert("أنت غير متصل بأي جهاز");
        conn.send({ command: action });
    }

    // تنفيذ الأوامر المستلمة (تحدث في جهاز الضحية/المستقبِل)
    function handleRemoteCommand(data) {
        if (data.command === 'get_location') {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    conn.send({
                        type: 'location_response',
                        lat: position.coords.latitude,
                        lon: position.coords.longitude
                    });
                });
            }
        } else if (data.command === 'open_site') {
            window.open('https://google.com', '_blank');
        } else if (data.command === 'alert') {
            alert("⚠️ تنبيه عن بُعد: تم الاتصال بجهازك بنجاح!");
        }
    }

    // كود زر تحميل وتثبيت التطبيق
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installBtn').style.display = 'block'; });
    document.getElementById('installBtn').addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; document.getElementById('installBtn').style.display = 'none'; } });
</script>

</body>
</html>
